name: Build Rokid APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Rokid debug APK
        run: gradle :glassesapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RokidCameraLink-Glasses-APK
          path: glassesapp/build/outputs/apk/debug/glassesapp-debug.apk
