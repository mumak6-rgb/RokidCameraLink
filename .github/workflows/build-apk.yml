name: Build Rokid APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        run: gradle :glassesapp:assembleDebug :phoneapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RokidCameraLink-Glasses-APK
          path: glassesapp/build/outputs/apk/debug/glassesapp-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RokidCameraLink-Phone-APK
          path: phoneapp/build/outputs/apk/debug/phoneapp-debug.apk
